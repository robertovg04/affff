const dataset = {
 eq:[{freq:100,type:"highpass"},{freq:250,gain:-5.5,q:1.4},{freq:2700,gain:4.5,q:1},{freq:5200,gain:3,type:"peaking",q:1.2}],
 comp:{threshold:-18,ratio:3.2,attack:0.012,release:0.16}
};

async function melhorarAudio(audioBuffer){
  const offline = new OfflineAudioContext(1, audioBuffer.length, audioBuffer.sampleRate);
  const src = offline.createBufferSource(); src.buffer = audioBuffer;
  let last = src;
  dataset.eq.forEach(e=>{
    const f = offline.createBiquadFilter();
    f.frequency.value=e.freq; f.gain.value=e.gain||0; f.Q.value=e.q||0.7;
    f.type = e.type==="highpass"?"highpass": e.type==="highshelf"?"highshelf":"peaking";
    last.connect(f); last=f;
  });
  const comp = offline.createDynamicsCompressor();
  comp.threshold.value=dataset.comp.threshold; comp.ratio.value=dataset.comp.ratio;
  comp.attack.value=dataset.comp.attack; comp.release.value=dataset.comp.release;
  last.connect(comp); comp.connect(offline.destination);
  src.start(0);
  return await offline.render();
}
